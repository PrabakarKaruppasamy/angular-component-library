<div class="pk-table-wrap">
  <!-- Search -->
  <div class="pk-table-toolbar" *ngIf="searchable">
    <div class="pk-table-search">
      <span class="material-icons">search</span>
      <input type="search" placeholder="Search..." [value]="searchTerm()"
             (input)="searchTerm.set($any($event.target).value); currentPage.set(1)" />
    </div>
    <span class="pk-table-count">{{ filtered().length }} result{{ filtered().length !== 1 ? 's' : '' }}</span>
  </div>

  <!-- Table -->
  <div class="pk-table-scroll">
    <!-- Loader -->
    <div class="pk-table-loader" *ngIf="loading">
      <div class="pk-spinner"></div>
    </div>

    <table [class.pk-table--striped]="striped" [class.pk-table--hoverable]="hoverable" [attr.aria-label]="caption">
      <caption *ngIf="caption">{{ caption }}</caption>
      <thead>
        <tr>
          <th *ngFor="let col of columns"
              [style.width]="col.width"
              [class.pk-th--sortable]="col.sortable"
              [class.pk-th--sorted]="sortKey() === col.key"
              [attr.aria-sort]="sortKey() === col.key ? sortDir() : null"
              (click)="onSort(col)">
            <div class="pk-th-inner" [class]="'pk-th-inner--' + (col.align ?? 'left')">
              {{ col.label }}
              <span class="material-icons pk-sort-icon" *ngIf="col.sortable">{{ sortIcon(col.key) }}</span>
            </div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of paginated()" (click)="rowClicked.emit(row)" tabindex="0">
          <td *ngFor="let col of columns" [class]="'pk-td--' + (col.align ?? 'left')">
            {{ getCellValue(row, col) }}
          </td>
        </tr>
        <tr *ngIf="paginated().length === 0 && !loading">
          <td [attr.colspan]="columns.length" class="pk-table-empty">
            <span class="material-icons">inbox</span>
            <p>{{ emptyMessage }}</p>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pk-table-pagination" *ngIf="paginate && filtered().length > 0">
    <span class="pk-page-info">{{ rangeStart }}–{{ rangeEnd }} of {{ filtered().length }}</span>
    <div class="pk-page-btns">
      <button class="pk-page-btn" (click)="setPage(currentPage() - 1)" [disabled]="currentPage() === 1">
        <span class="material-icons">chevron_left</span>
      </button>
      <button *ngFor="let p of pageNumbers()" class="pk-page-btn" [class.pk-page-btn--active]="p === currentPage()"
              (click)="setPage(p)">{{ p }}</button>
      <button class="pk-page-btn" (click)="setPage(currentPage() + 1)" [disabled]="currentPage() === totalPages()">
        <span class="material-icons">chevron_right</span>
      </button>
    </div>
  </div>
</div>
